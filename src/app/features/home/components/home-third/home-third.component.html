<section class="py-10">
    <div class="container mx-auto px-4">
        <div class="grid md:grid-cols-2 gap-6">
            @for (item of thirdList; track item.title) {
            <div class="relative overflow-hidden rounded-2xl p-6 sm:p-8 md:p-10 text-white shadow-sm flex flex-col justify-between"
                [class]="item.backgroundClass">
                <div class="absolute -top-12 -right-12 w-48 h-48 rounded-full bg-white/10 pointer-events-none"></div>
                <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-white/5 pointer-events-none"></div>

                <div class="relative z-10">
                    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/20 backdrop-blur-xs text-xs font-medium mb-4">
                        <span>{{ item.badgeIcon }}</span>
                        <span>{{ item.badge }}</span>
                    </div>

                    <h2 class="text-2xl sm:text-3xl font-bold mb-2 tracking-tight">
                        {{ item.title }}
                    </h2>
                    <p class="text-white/85 text-sm mb-4">
                        {{ item.description }}
                    </p>

                    <div class="flex items-baseline gap-2 mb-6">
                        <span class="text-2xl font-black">{{ item.discount }}</span>
                        <span class="text-xs text-white/90">Use code: <strong class="font-bold text-white">{{ item.code }}</strong></span>
                    </div>
                </div>

                <div class="relative z-10">
                    <a routerLink="/shop" class="inline-flex items-center gap-2 bg-white font-semibold text-sm px-6 py-2.5 rounded-full shadow-xs hover:bg-gray-100 hover:shadow-md transition-all duration-200 group w-fit cursor-pointer"
                        [style.color]="item.buttonTextColor">
                        <span>{{ item.actionLabel }}</span>
                        <i class="fa-solid fa-arrow-right text-xs transition-transform duration-200 group-hover:translate-x-1"></i>
                    </a>
                </div>
            </div>
            }
        </div>
    </div>
</section>
