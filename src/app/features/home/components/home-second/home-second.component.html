<section class="py-10">
    <div class="container mx-auto px-4">
        <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-8">
            <div class="flex  items-center gap-3 my-8">
                <div class="h-8 w-1.5 bg-linear-to-b from-emerald-500 to-emerald-700 rounded-full">
                </div>
                <h2 class="text-2xl md:text-3xl font-bold text-gray-800">
                    Shop By 
                    <span class="text-emerald-600">
                        Category
                    </span>
                </h2>
            </div>
            <a href="" class="text-primary-600 self-end sm:self-auto hover:text-primary-700 font-medium flex items-center cursor-pointer">
                View All Categories
            </a>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
            @for (category of CategoryList(); track category._id) {
                <a [routerLink]="['/categoryDetails', category._id]" class="bg-white rounded-lg p-4 text-center shadow-sm hover:shadow-md transition group cursor-pointer">
                    <div class="h-20 w-20 overflow-hidden bg-primary-100 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:bg-primary-200 transition">
                        <img [src]="category.image" alt="" class="w-full h-full object-cover">
                    </div>
                    <h2 class="font-medium">
                        {{category.name}}
                    </h2>
                </a>
            }
        </div>
    </div>
</section>
