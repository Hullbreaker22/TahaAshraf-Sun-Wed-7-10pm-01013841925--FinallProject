<section class="relative flex min-h-[75vh] items-center justify-center overflow-hidden bg-linear-to-b from-emerald-50/70 via-white to-gray-50 px-4 py-16">

      </div>

      <span class="bg-linear-to-r from-emerald-500 to-[#16843f] bg-clip-text text-7xl font-black tracking-tight text-transparent sm:text-8xl">

    <h1 class="mt-5 text-2xl font-bold text-gray-900 sm:text-3xl">
      Looks like this shelf is empty

    </p>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
      <a
        routerLink="/home"
        class="inline-flex cursor-pointer items-center gap-2 rounded-full bg-[#16a249] px-6 py-3 text-sm font-semibold text-white shadow-md shadow-emerald-600/20 transition hover:bg-[#16843f] active:scale-[0.99]"

        <i class="fa-solid fa-house text-xs" aria-hidden="true"></i>

      </a>

      <a
        routerLink="/search"
        class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-gray-200 bg-white px-6 py-3 text-sm font-semibold text-gray-700 transition hover:border-emerald-300 hover:bg-emerald-50/50 hover:text-[#16a249]"

        <i class="fa-solid fa-magnifying-glass text-xs" aria-hidden="true"></i>
        <span>Browse Products</span>
      </a>

    <div class="mt-8 border-t border-gray-100 pt-6">

      <div class="flex flex-wrap items-center justify-center gap-2 text-xs font-medium">

        <a
          routerLink="/cart"
          class="rounded-full cursor-pointer bg-gray-100 px-3.5 py-1.5 text-gray-600 transition hover:bg-emerald-100 hover:text-emerald-800"
